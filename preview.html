<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Jar of Notes</title>
<meta name="description" content="A little jar full of sweet notes, just for you 💌">
<meta property="og:title" content="A Little Jar of Notes 💌">
<meta property="og:description" content="Open the jar and pick a little note made just for you. 💗">
<meta property="og:type" content="website">

<style>
:root{--bg:#fff1f5;--ink:#6b3a4e;--glass:rgba(255,255,255,.55);--edge:#f4b6c8;--card:#fffdf7;--lid:#ff9fba;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1b26;--ink:#ffd9e6;--glass:rgba(255,255,255,.12);--edge:#a8607c;--card:#3a2733;--lid:#d9738f;}}
:root[data-theme="dark"]{--bg:#2a1b26;--ink:#ffd9e6;--glass:rgba(255,255,255,.12);--edge:#a8607c;--card:#3a2733;--lid:#d9738f;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Patrick Hand","Comic Sans MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow-x:hidden}
h1{font-size:1.5rem;margin:0;text-align:center;font-weight:600}
.sub{margin:0;opacity:.75;font-size:1rem;text-align:center}
.wrap{display:flex;flex-direction:column;align-items:center;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.lid{width:190px;height:34px;background:var(--lid);border-radius:14px 14px 8px 8px;position:relative;z-index:2;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.lid:before{content:"";position:absolute;left:50%;top:-14px;width:26px;height:18px;margin-left:-13px;background:var(--lid);border-radius:12px 12px 0 0}
.neck{width:210px;height:14px;background:var(--glass);border:3px solid var(--edge);border-bottom:0;border-radius:10px 10px 0 0;margin-top:-2px}
.jar{width:min(290px,80vw);height:330px;background:var(--glass);border:4px solid var(--edge);border-radius:36px 36px 80px 80px;position:relative;overflow:hidden;box-shadow:inset 10px 0 0 rgba(255,255,255,.35),0 14px 24px rgba(200,100,140,.25)}
.jar:after{content:"";position:absolute;left:14px;top:26px;width:12px;height:130px;border-radius:10px;background:rgba(255,255,255,.55);pointer-events:none}
.label{position:absolute;left:50%;bottom:44px;transform:translateX(-50%) rotate(-3deg);background:#fff;color:#c2557a;padding:4px 14px;border-radius:8px;font-size:.95rem;border:2px dashed #f4b6c8;z-index:0;white-space:nowrap}
.paper{position:absolute;width:58px;height:42px;border:0;border-radius:6px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .2s;z-index:1;font-size:15px;padding:0;color:rgba(0,0,0,.35)}
.paper:before{content:"";position:absolute;right:0;top:0;width:18px;height:18px;border-radius:0 6px 0 0;background:linear-gradient(225deg,rgba(255,255,255,.65) 50%,rgba(0,0,0,.1) 50%)}
.paper:hover,.paper:focus-visible{transform:translateY(-6px) rotate(0deg)!important;outline:none}
.paper.read{filter:saturate(.45) brightness(1.05)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button.b{font:inherit;font-size:1rem;background:var(--lid);color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
button.b.alt{background:var(--card);color:var(--ink);border:2px solid var(--edge)}
button.b:active{transform:translateY(2px);box-shadow:none}
.modal{position:fixed;inset:0;background:rgba(80,30,50,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.note{background:var(--card);color:var(--ink);width:min(340px,100%);border-radius:14px;padding:26px 22px 20px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.3);transform-origin:center top;animation:unfold .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes unfold{from{transform:scaleY(.1) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.note p{font-size:1.25rem;line-height:1.5;margin:0 0 18px;white-space:pre-wrap;word-break:break-word}
.note textarea{width:100%;height:110px;font:inherit;font-size:1.1rem;border:2px solid var(--edge);border-radius:10px;padding:10px;background:transparent;color:inherit;resize:none;margin-bottom:14px}
.heart{font-size:1.6rem;display:block;margin-bottom:6px}
.toast{font-size:.9rem;opacity:.7;min-height:1.2em}
</style>
</head>
<body>
<h1>🫙 A Little Jar of Notes</h1>
<p class="sub">tap a folded note to open it</p>

<div class="wrap">
  <div class="lid"></div>
  <div class="neck"></div>
  <div class="jar"><div class="label">little notes ♡</div><div id="papers"></div></div>
</div>

<div class="btns">
  <button class="b" id="rand">🎲 pick one for me</button>
  <button class="b alt" id="add">✏️ add a note</button>
  <button class="b alt" id="share">💚 share on WhatsApp</button>
</div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal"><div class="note" id="noteBox"></div></div>

<script>
const base=[
"You are doing better than you think. 🌷",
"Drink some water, sweet human. 💧",
"Someone out there is really glad you exist.",
"Today is allowed to be slow and soft. ☁️",
"You make hard things look gentle.",
"Tiny steps still count as steps. 🐾",
"Your laugh is my favourite sound.",
"Proud of you. Truly. Always.",
"It's okay to rest. The world can wait.",
"You are loved more than you know. 💗",
"Something good is on its way to you. ✨",
"Be kind to yourself today, like you are to others.",
"You are my favourite person to talk to.",
"Go eat something yummy. You deserve it. 🍓"
];
const colors=["#ffd1dc","#ffe9a8","#c9f0dd","#d4e4ff","#e6d4ff","#ffd9b8","#ffc2d9"];
let mine=[];const KEY="note-jar-mine";
try{mine=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){mine=[]}
const read=new Set();
const el=document.getElementById("papers"),modal=document.getElementById("modal"),box=document.getElementById("noteBox"),toast=document.getElementById("toast");
function all(){return base.concat(mine)}
function render(){
  el.innerHTML="";
  const msgs=all(),cols=4;
  msgs.forEach((m,i)=>{
    const r=Math.floor(i/cols),c=i%cols;
    const rnd=(n)=>((i*37+n*17)%13)/13;
    const b=document.createElement("button");
    b.className="paper"+(read.has(i)?" read":"");
    b.style.background=colors[i%colors.length];
    b.style.left=(8+c*66+rnd(1)*8)+"px";
    b.style.bottom=(10+r*32+rnd(2)*6)+"px";
    b.style.transform="rotate("+Math.round((rnd(3)-.5)*50)+"deg)";
    b.setAttribute("aria-label","Open folded note "+(i+1));
    b.textContent="♡";
    b.onclick=()=>open(i);
    el.appendChild(b);
  });
}
function open(i){
  read.add(i);
  box.innerHTML='<span class="heart">💌</span><p></p><button class="b" id="close">close</button>';
  box.querySelector("p").textContent=all()[i];
  box.querySelector("#close").onclick=close;
  modal.classList.add("show");render();
}
function close(){modal.classList.remove("show")}
modal.addEventListener("click",e=>{if(e.target===modal)close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
document.getElementById("rand").onclick=()=>open(Math.floor(Math.random()*all().length));
document.getElementById("add").onclick=()=>{
  box.innerHTML='<span class="heart">✏️</span><textarea id="t" maxlength="200" placeholder="write something sweet..."></textarea><div class="btns"><button class="b alt" id="c">cancel</button><button class="b" id="s">fold it in</button></div>';
  modal.classList.add("show");
  box.querySelector("#c").onclick=close;
  box.querySelector("#s").onclick=()=>{
    const v=box.querySelector("#t").value.trim();
    if(!v)return;
    mine.push(v);
    try{localStorage.setItem(KEY,JSON.stringify(mine))}catch(e){}
    close();render();
    toast.textContent="folded into your jar 💕 (only you can see it on this device)";
  };
};
render();
</script>
</body>
</html>
